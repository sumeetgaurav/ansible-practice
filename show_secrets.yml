---                                          # Start of YAML document
- name: Show Secrets                         # Play name (label shown in output)
  hosts: servers                             # Run on the [servers] group from hosts.ini
  become: yes                                # Use sudo for all tasks (not really needed here, since debug runs locally)

  vars_files:                                # Load variables from external files
    - secrets.yml                            # File holding the variables: password and api_key

  tasks:                                     # List of tasks to run, in order
    - name: Show password                    # Task name
      debug:                                 # debug module prints text to the screen
        msg: "My password is {{ password }}"   # Prints the value of the password variable from secrets.yml
      no_log: true

    - name: Show API Key                     # Task name
      debug:                                 # debug module prints text to the screen
        msg: "My API Key is {{ api_key }}"   # Prints the value of the api_key variable from secrets.yml
      no_log: true
